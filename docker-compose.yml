version: "3.9"

services:
  server:
    image: 979188187252.dkr.ecr.ap-south-1.amazonaws.com/creatorsync-server:latest
    build: ./
    env_file: ./.env
    environment:
      SERVICE: server
    depends_on:
      - redis  
      - media-service
    ports:
      - "8000:8000"

  media-service:
    image: 979188187252.dkr.ecr.ap-south-1.amazonaws.com/creatorsync-server:latest
    build: ./
    env_file: ./.env
    environment: 
      SERVICE: media-service
    depends_on:
      - redis
    ports:
      - "8001:8001"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
